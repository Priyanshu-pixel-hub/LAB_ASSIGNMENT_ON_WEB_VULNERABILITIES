<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Portal — Login</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header>
    <h1>Apex University Student Portal</h1>
    <span>Cyber Security Lab (IT-30001)</span>
  </header>

  <main class="container" style="max-width: 440px;">
    <div class="box">
      <h2>Sign In</h2>

      <div id="login-error" class="alert alert-danger" style="display: none;"></div>

      <div class="alert alert-info">
        <strong>Fictional Test Credentials:</strong><br>
        Username: <code>student</code><br>
        Password: <code>Password123!</code><br>
        <button type="button" id="btn-autofill" class="btn btn-secondary btn-sm" style="margin-top: 8px;">
          Auto-Fill Credentials
        </button>
      </div>

      <form id="login-form">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" required autocomplete="username">
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" required autocomplete="current-password">
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 8px;">
          Log In
        </button>
      </form>
    </div>
  </main>

  <script src="/app.js"></script>
</body>
</html>
